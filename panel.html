<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HAR 解密 - DevTools</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; }
  body { display: flex; flex-direction: column; background: #1a1a1a; color: #ddd; }
  header {
    padding: 10px 16px; background: rgba(30,30,30,.95);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }
  header button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px;
    background: rgba(255,255,255,.1); color: #eee;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 500;
    white-space: nowrap; transition: background .15s;
    user-select: none; line-height: 1;
  }
  header button:hover:not(:disabled) { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.26); }
  header button:disabled { background: rgba(255,255,255,.03); color: rgba(255,255,255,.28); border-color: rgba(255,255,255,.06); cursor: not-allowed; }
  header button.primary { background: rgba(10,132,255,.85); border-color: rgba(10,132,255,.5); color: #fff; }
  header button.primary:hover:not(:disabled) { background: rgba(10,132,255,1); }
  header button.success { background: rgba(52,199,89,.85); border-color: rgba(52,199,89,.5); color: #fff; }
  header button.success:hover:not(:disabled) { background: rgba(52,199,89,1); }
  header button.toggle-active { background: rgba(255,159,10,.85); border-color: rgba(255,159,10,.5); color: #fff; }
  header .divider { width: 1px; height: 20px; background: rgba(255,255,255,.12); margin: 0 4px; flex-shrink: 0; }
  #stats {
    color: rgba(255,255,255,.75); font-size: 12px; margin-left: auto;
    padding: 5px 12px; background: rgba(0,0,0,.35);
    border-radius: 6px; border: 1px solid rgba(255,255,255,.1);
    font-weight: 500;
  }

  .filter-bar {
    padding: 8px 14px; background: rgba(30,30,30,.85);
    color: #ddd; border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; flex-direction: column; gap: 6px;
    transition: max-height .25s ease, padding .25s ease, opacity .2s ease;
    max-height: 640px; overflow: hidden;
  }
  .filter-bar.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; border-bottom: none; opacity: 0; }
  .filter-hint { font-size: 11px; color: rgba(255,255,255,.55); display: flex; align-items: center; gap: 12px; }
  .filter-hint .kbd { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.6); }
  .filter-hint .kbd.inc { border-color: #0e639c; color: #6ab8ef; }
  .filter-hint .kbd.exc { border-color: #b91c1c; color: #ef8a8a; }
  .filter-row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  .filter-row .label { color: rgba(255,255,255,.55); font-size: 11px; min-width: 40px; user-select: none; padding-top: 5px; }
  .tag-group { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; max-height: 130px; overflow-y: auto; padding: 1px 0; }
  .tag-btn {
    padding: 3px 10px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06); color: rgba(255,255,255,.7);
    border-radius: 5px; cursor: pointer; font-size: 11px;
    white-space: nowrap; user-select: none; transition: all .12s;
    font-family: inherit;
  }
  .tag-btn:hover { border-color: rgba(255,255,255,.4); color: #fff; background: rgba(255,255,255,.12); }
  .tag-btn.all-btn { border-color: rgba(90,170,230,.6); color: rgba(150,210,255,.9); }
  .tag-btn.all-btn.active { background: rgba(14,99,156,.8); color: #fff; border-color: rgba(90,170,230,.8); }
  .tag-btn.include { background: rgba(14,99,156,.85); color: #fff; border-color: rgba(90,170,230,.8); }
  .tag-btn.include::before { content: "✓ "; font-weight: bold; }
  .tag-btn.exclude { background: rgba(185,28,28,.85); color: #fff; border-color: rgba(230,100,100,.8); }
  .tag-btn.exclude::before { content: "− "; font-weight: bold; }
  .reset-btn {
    padding: 4px 10px; border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.06); color: rgba(255,255,255,.75);
    border-radius: 5px; cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .reset-btn:hover { border-color: rgba(255,255,255,.5); color: #fff; background: rgba(255,255,255,.12); }

  .search-wrap { flex: 1; position: relative; display: flex; align-items: center; gap: 10px; max-width: 680px; }
  #searchInput {
    flex: 1; padding: 6px 32px 6px 12px;
    border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    background: rgba(0,0,0,.35); color: #eee; font-size: 12px;
    font-family: inherit; outline: none;
  }
  #searchInput:focus { border-color: #4fa3e0; box-shadow: 0 0 0 2px rgba(79,163,224,.2); }
  #searchInput::placeholder { color: rgba(255,255,255,.3); }
  .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; border: none; background: rgba(255,255,255,.15);
    color: rgba(255,255,255,.7); border-radius: 50%; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0;
    display: none; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .search-clear:hover { background: rgba(255,255,255,.3); color: #fff; }
  .search-count { font-size: 11px; color: #7ddf7d; white-space: nowrap; padding: 0 4px; min-width: 60px; }
  .search-count.building { color: #ffcc80; }
  .search-count.empty { color: #ef8a8a; }

  main { flex: 1; display: flex; overflow: hidden; }
  aside {
    width: 42%; max-width: 640px; border-right: 1px solid rgba(255,255,255,.08);
    overflow-y: auto; background: rgba(20,20,20,.5);
    contain: layout style;
  }
  #entryList .entry {
    padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,.06);
    cursor: pointer; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    user-select: none; color: #ddd; transition: background-color .15s;
    border-left: 3px solid transparent;
    contain: content;
  }
  #entryList .entry:hover { background: rgba(255,255,255,.08); }
  #entryList .entry.active { border-left-color: #4fa3e0; background: rgba(14,99,156,.25); }
  #entryList .entry.pressing { box-shadow: inset 0 0 0 2px rgba(217,119,6,.6); }
  .entry.marked-yellow { background: rgba(255,235,59,.2); }
  .entry.marked-red { background: rgba(239,83,80,.2); }
  .entry.marked-green { background: rgba(76,175,80,.2); }
  .entry.marked-blue { background: rgba(66,165,245,.2); }
  .entry.marked-purple { background: rgba(171,71,188,.2); }
  #entryList .url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: monospace; font-size: 12px; }
  #entryList .status { font-size: 11px; color: rgba(255,255,255,.55); }
  #entryList .status.ok { color: #7ddf7d; }
  #entryList .status.err { color: #ef8a8a; }
  #entryList .type-tag {
    font-size: 10px; color: rgba(255,255,255,.6); padding: 1px 5px;
    border: 1px solid rgba(255,255,255,.15); border-radius: 3px;
    background: rgba(255,255,255,.06); white-space: nowrap;
  }
  #entryList .entry-note {
    width: 100%; margin-top: 2px; padding-left: 3px; font-size: 11px;
    color: rgba(255,255,255,.6); font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #entryList .entry-note::before { content: "备注："; color: rgba(255,255,255,.4); font-style: normal; font-weight: bold; }
  #entryList .live-tag {
    font-size: 9px; color: #a5d6a7; padding: 1px 5px;
    border: 1px solid rgba(76,175,80,.4); border-radius: 3px;
    background: rgba(76,175,80,.15); white-space: nowrap;
  }
  #entryList .hist-tag {
    font-size: 9px; color: #ffcc80; padding: 1px 5px;
    border: 1px solid rgba(255,159,10,.4); border-radius: 3px;
    background: rgba(255,159,10,.15); white-space: nowrap;
  }
  .method {
    font-weight: bold; padding: 2px 8px; border-radius: 4px; color: #fff;
    font-size: 11px; min-width: 54px; text-align: center;
    letter-spacing: .5px; background: #6b7280;
    font-family: monospace;
  }
  .method.method-GET { background: #2f855a; }
  .method.method-POST { background: #d97706; padding: 3px 10px; }
  .method.method-PUT { background: #2563eb; }
  .method.method-DELETE { background: #dc2626; }
  .method.method-PATCH { background: #7c3aed; }
  .method.method-HEAD { background: #0891b2; }
  .method.method-OPTIONS { background: #6b7280; }

  .context-menu {
    position: fixed; z-index: 2000; background: rgba(30,30,30,.97); color: #ddd;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.5);
    padding: 8px; min-width: 190px; font-size: 12px;
  }
  .context-menu .ctx-row { display: flex; gap: 6px; align-items: center; padding: 4px 4px 10px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 6px; }
  .context-menu .ctx-label { color: rgba(255,255,255,.5); font-size: 11px; }
  .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; outline: none; transition: transform .1s, border-color .1s; }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(30,30,30,.8) inset; }
  .color-yellow { background: #ffe082; } .color-red { background: #ef9a9a; }
  .color-green { background: #a5d6a7; } .color-blue { background: #90caf9; }
  .color-purple { background: #ce93d8; }
  .context-menu .ctx-btn {
    display: block; width: 100%; text-align: left; padding: 7px 10px;
    border: none; background: transparent; cursor: pointer; font-size: 12px;
    color: #ddd; border-radius: 4px; margin-top: 2px;
    font-family: inherit;
  }
  .context-menu .ctx-btn:hover { background: rgba(255,255,255,.1); }
  .context-menu .ctx-btn.danger { color: #ef8a8a; }
  .context-menu .ctx-btn.danger:hover { background: rgba(185,28,28,.25); }

  section { flex: 1; overflow-y: auto; padding: 16px 20px; background: rgba(20,20,20,.4); color: #ddd; }
  .empty { text-align: center; color: rgba(255,255,255,.35); padding-top: 120px; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; color: rgba(255,255,255,.45); margin-bottom: 4px; font-size: 12px; }
  .field > .value { font-family: monospace; word-break: break-all; color: #eee; }
  .section-title { font-weight: bold; font-size: 14px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid rgba(79,163,224,.4); color: #eee; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar select {
    padding: 5px 10px; border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    background: rgba(30,30,30,.8); color: #ddd; min-width: 260px; font-size: 12px;
    font-family: inherit;
  }
  .toolbar select option { background: #222; color: #ddd; }
  .tag { display: inline-block; padding: 2px 8px; background: rgba(255,255,255,.1); color: rgba(255,255,255,.7); border-radius: 4px; font-size: 11px; }
  .label-mini { color: rgba(255,255,255,.45); margin: 12px 0 5px; font-size: 12px; }
  pre {
    background: rgba(0,0,0,.5); color: #c8d0d8; padding: 12px; border-radius: 8px;
    overflow: auto; max-height: 400px; font-size: 12px;
    font-family: "Consolas", "Monaco", monospace;
    white-space: pre-wrap; word-break: break-all; margin: 0;
    border: 1px solid rgba(255,255,255,.08);
  }
  pre.err { background: rgba(60,20,20,.6); color: #ef9a9a; border-color: rgba(239,83,80,.3); }
  pre.empty { background: rgba(255,255,255,.04); color: rgba(255,255,255,.35); padding: 10px; }
  pre.loading { background: rgba(255,255,255,.04); color: rgba(255,255,255,.5); padding: 10px; font-style: italic; }
  pre.json-view { line-height: 1.6; }
  pre.json-view .j-key    { color: #9cdcfe; }
  pre.json-view .j-string { color: #ce9178; }
  pre.json-view .j-number { color: #b5cea8; }
  pre.json-view .j-bool,
  pre.json-view .j-null   { color: #569cd6; }
  pre.json-view .j-ts     { color: #6a9955; font-style: italic; }
  details.original-block { margin-bottom: 6px; }
  details.original-block > summary { cursor: pointer; color: #6ab8ef; font-size: 12px; padding: 5px 0; user-select: none; }
  details.original-block > summary:hover { color: #9ad0ff; }
  details.original-block pre { margin-top: 5px; }
  .media-preview { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 16px; margin: 10px 0; display: flex; align-items: center; justify-content: center; }
  .media-preview img { max-width: 100%; max-height: 420px; border-radius: 6px; }
  .media-preview audio { width: 100%; max-width: 520px; }
  .media-preview video { max-width: 100%; max-height: 420px; border-radius: 6px; }
  .media-meta { font-size: 11px; color: rgba(255,255,255,.4); margin-bottom: 6px; }
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: rgba(30,30,30,.97); color: #fff; padding: 12px 24px;
    border-radius: 8px; font-size: 13px; z-index: 3000;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    border: 1px solid rgba(255,255,255,.15);
    animation: toastIn .2s ease; font-family: inherit;
  }
  .toast.ok { border-color: rgba(76,175,80,.5); color: #a5d6a7; }
  .toast.err { border-color: rgba(239,83,80,.5); color: #ef9a9a; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 1500; display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: rgba(28,28,30,.98); color: #e0e0e0;
    width: 860px; max-width: 94vw; max-height: 90vh;
    border-radius: 12px; box-shadow: 0 24px 80px rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.12);
    display: flex; flex-direction: column; overflow: hidden;
    font-family: inherit;
  }
  .modal-header { padding: 16px 22px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: space-between; }
  .modal-header h2 { margin: 0; font-size: 15px; color: #eee; font-weight: 600; }
  .modal-close { border: none; background: transparent; font-size: 24px; color: rgba(255,255,255,.5); cursor: pointer; padding: 0 8px; line-height: 1; border-radius: 4px; }
  .modal-close:hover { background: rgba(255,255,255,.1); color: #fff; }
  .modal-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.2); }
  .modal-tab { padding: 12px 22px; border: none; background: transparent; cursor: pointer; font-size: 13px; color: rgba(255,255,255,.5); border-bottom: 2px solid transparent; font-weight: 500; transition: all .15s; font-family: inherit; }
  .modal-tab:hover { color: #9ad0ff; background: rgba(255,255,255,.04); }
  .modal-tab.active { color: #6ab8ef; border-bottom-color: #4fa3e0; background: rgba(14,99,156,.1); }
  .modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .panel-toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,.1); flex-wrap: wrap; }
  .panel-toolbar .hint { font-size: 11px; color: rgba(255,255,255,.4); }
  .btn-primary { background: rgba(14,99,156,.85); color: #fff; border: 1px solid rgba(90,170,230,.5); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 500; transition: all .15s; font-family: inherit; }
  .btn-primary:hover { background: rgba(20,120,190,.95); }
  .btn-secondary { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: rgba(255,255,255,.8); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 12.5px; transition: all .15s; font-family: inherit; }
  .btn-secondary:hover { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.3); color: #fff; }
  .config-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .config-empty { padding: 28px; text-align: center; color: rgba(255,255,255,.35); background: rgba(255,255,255,.03); border: 1px dashed rgba(255,255,255,.12); border-radius: 8px; font-size: 12px; }
  .config-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; transition: border-color .15s; }
  .config-item:hover { border-color: rgba(79,163,224,.4); background: rgba(255,255,255,.06); }
  .config-item-main { flex: 1; min-width: 0; }
  .config-item-title { font-size: 13px; font-weight: 600; color: #eee; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .config-item-id { font-family: monospace; font-size: 11px; color: rgba(255,255,255,.5); background: rgba(255,255,255,.08); padding: 1px 7px; border-radius: 4px; font-weight: normal; }
  .badge-file { background: rgba(34,140,60,.25); color: #a5d6a7; padding: 1px 7px; border-radius: 4px; font-size: 10.5px; }
  .badge-session { background: rgba(217,119,6,.25); color: #ffcc80; padding: 1px 7px; border-radius: 4px; font-size: 10.5px; }
  .badge-error { background: rgba(239,83,80,.25); color: #ef9a9a; padding: 1px 7px; border-radius: 4px; font-size: 10.5px; }
  .badge-keys { background: rgba(34,140,60,.25); color: #a5d6a7; padding: 1px 7px; border-radius: 4px; font-size: 10.5px; }
  .config-item-preview { font-family: monospace; font-size: 11px; color: rgba(255,255,255,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
  .config-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .config-item-actions button { padding: 5px 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: rgba(255,255,255,.75); border-radius: 5px; cursor: pointer; font-size: 11.5px; transition: all .12s; font-family: inherit; }
  .config-item-actions button:hover { border-color: rgba(90,170,230,.6); color: #9ad0ff; background: rgba(14,99,156,.2); }
  .config-item-actions button.danger { color: #ef9a9a; border-color: rgba(239,83,80,.3); }
  .config-form { background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 16px; margin-top: 10px; }
  .form-row { margin-bottom: 14px; }
  .form-row > label { display: block; font-size: 12px; color: rgba(255,255,255,.65); margin-bottom: 6px; font-weight: 500; }
  .form-row input[type=text], .form-row select { width: 100%; padding: 8px 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 6px; font-size: 12.5px; color: #eee; background: rgba(0,0,0,.3); font-family: inherit; }
  .form-row input[type=text]:focus, .form-row select:focus { outline: none; border-color: #4fa3e0; box-shadow: 0 0 0 2px rgba(79,163,224,.2); }
  .form-row select option { background: #222; color: #eee; }
  .form-row textarea { width: 100%; min-height: 180px; padding: 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 6px; font-family: "Consolas", monospace; font-size: 12px; color: #c8d0d8; background: rgba(0,0,0,.4); resize: vertical; line-height: 1.55; }
  .form-row textarea:focus { outline: none; border-color: #4fa3e0; }
  .form-row .hint { font-size: 11px; color: rgba(255,255,255,.35); margin-top: 6px; line-height: 1.6; }
  .form-row .hint code { background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 3px; font-family: monospace; color: rgba(255,255,255,.65); }
  .form-actions { display: flex; gap: 10px; margin-top: 14px; }
  .form-error { background: rgba(185,28,28,.2); border: 1px solid rgba(239,83,80,.4); color: #ef9a9a; padding: 10px 14px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
  .export-box { background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 14px; margin: 10px 0; }
  .export-box textarea { width: 100%; min-height: 220px; padding: 10px; border: none; border-radius: 6px; font-family: "Consolas", monospace; font-size: 12px; color: #c8d0d8; background: rgba(0,0,0,.5); resize: vertical; line-height: 1.5; }
</style>
</head>
<body>
  <header>
    <button id="configBtn">⚙️ 解密配置</button>
    <span class="divider"></span>
    <button id="toggleFilterBtn" disabled>🔽 展开过滤</button>
    <button id="autoDecryptAllBtn" disabled>🔓 批量解密</button>
    <span class="divider"></span>
    <button id="exportBtn" class="primary" disabled>💾 导出 HAR</button>
    <button id="clearBtn">🗑️ 清空</button>
    <span id="stats">等待请求…</span>
  </header>

  <div class="filter-bar collapsed" id="filterBar">
    <div class="filter-hint">
      <span>点击按钮切换状态：</span>
      <span class="kbd">未选</span><span>→</span>
      <span class="kbd inc">✓ 包含</span><span>→</span>
      <span class="kbd exc">− 排除</span><span>→</span>
      <span class="kbd">未选</span>
      <button class="reset-btn" id="resetFilterBtn" style="margin-left:auto;">重置过滤</button>
    </div>
    <div class="filter-row">
      <span class="label">搜索</span>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="搜索请求（不区分大小写）…">
        <span class="search-count" id="searchCount"></span>
        <button class="search-clear" id="searchClearBtn">×</button>
      </div>
    </div>
    <div class="filter-row"><span class="label">方法</span><div id="methodGroup" class="tag-group"></div></div>
    <div class="filter-row"><span class="label">类型</span><div id="typeGroup" class="tag-group"></div></div>
    <div class="filter-row"><span class="label">MIME</span><div id="mimeGroup" class="tag-group"></div></div>
    <div class="filter-row"><span class="label">域名</span><div id="domainGroup" class="tag-group"></div></div>
  </div>

  <main>
    <aside id="entryListAside"><div id="entryList"><div style="padding:24px;text-align:center;color:rgba(255,255,255,.35);">等待请求中…</div></div></aside>
    <section id="detailPanel"><div class="empty">点击左侧请求查看并解密</div></section>
  </main>

  <div class="modal-backdrop" id="configModal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>⚙️ 解密配置</h2>
        <button class="modal-close" id="modalCloseBtn">×</button>
      </div>
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="decoders">解密算法</button>
        <button class="modal-tab" data-tab="rules">域名规则</button>
        <button class="modal-tab" data-tab="export">导出配置</button>
      </div>
      <div class="modal-body">
        <div class="tab-pane active" data-pane="decoders">
          <div class="panel-toolbar">
            <button class="btn-primary" id="addDecoderBtn">+ 会话内添加算法</button>
            <button class="btn-secondary" id="reloadFilesBtn">🔄 重载文件</button>
            <span class="hint">「文件」标记者来自 decoders.js，「会话」标记者仅当前页面有效</span>
          </div>
          <div id="decoderList" class="config-list"></div>
          <div id="decoderForm" class="config-form" style="display:none;">
            <div id="decoderFormError" class="form-error" style="display:none;"></div>
            <div class="form-row"><label>算法 ID</label><input type="text" id="decoderIdInput" placeholder="例如 myAes"></div>
            <div class="form-row">
              <label>从模板填充代码</label>
              <select id="decoderTemplateSelect"><option value="">-- 手动填写 --</option></select>
            </div>
            <div class="form-row"><label>显示名称</label><input type="text" id="decoderLabelInput" placeholder="例如 我的 AES 解密"></div>
            <div class="form-row"><label>CDN 依赖（可选，逗号分隔）</label><input type="text" id="decoderCdnInput"></div>
            <div class="form-row">
              <label>代码（函数表达式）</label>
              <textarea id="decoderCodeInput" spellcheck="false"></textarea>
              <div class="hint">签名：<code>function(bytes, ctx)</code> 或 <code>async function(bytes, ctx)</code>。可用全局：<code>pako</code>、<code>TextDecoder</code>、<code>crypto</code>、<code>atob</code>、<code>btoa</code>。</div>
            </div>
            <div class="form-actions">
              <button class="btn-primary" id="saveDecoderBtn">保存（仅本次会话）</button>
              <button class="btn-secondary" id="cancelDecoderBtn">取消</button>
            </div>
          </div>
        </div>

        <div class="tab-pane" data-pane="rules">
          <div class="panel-toolbar">
            <button class="btn-primary" id="addRuleBtn">+ 会话内添加规则</button>
            <button class="btn-secondary" id="reloadFilesBtn2">🔄 重载文件</button>
            <span class="hint">「文件」标记者来自 rules.js，「会话」标记者仅当前页面有效</span>
          </div>
          <div id="ruleList" class="config-list"></div>
          <div id="ruleForm" class="config-form" style="display:none;">
            <div id="ruleFormError" class="form-error" style="display:none;"></div>
            <div class="form-row">
              <label>域名模式</label>
              <div style="display:flex;gap:8px;">
                <input type="text" id="rulePatternInput" style="flex:1;">
                <select id="ruleTypeSelect" style="width:120px;flex:none;">
                  <option value="string">包含</option><option value="regex">正则</option>
                </select>
              </div>
            </div>
            <div class="form-row"><label>请求体默认解码</label><select id="ruleReqDecoderSelect"></select></div>
            <div class="form-row"><label>响应体默认解码</label><select id="ruleResDecoderSelect"></select></div>
            <div class="form-row">
              <label>密钥配置（JSON，可选）</label>
              <textarea id="ruleKeysInput" spellcheck="false" placeholder='{"key": "hex", "iv": "hex"}' style="min-height:90px;"></textarea>
            </div>
            <div class="form-actions">
              <button class="btn-primary" id="saveRuleBtn">保存（仅本次会话）</button>
              <button class="btn-secondary" id="cancelRuleBtn">取消</button>
            </div>
          </div>
        </div>

        <div class="tab-pane" data-pane="export">
          <div class="panel-toolbar">
            <button class="btn-primary" id="exportDecodersBtn">生成 decoders.js 片段</button>
            <button class="btn-primary" id="exportRulesBtn">生成 rules.js 片段</button>
            <button class="btn-secondary" id="copyExportBtn">📋 复制</button>
          </div>
          <div class="export-box"><textarea id="exportOutput" readonly placeholder="点击上方按钮生成代码片段"></textarea></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 全部改成外链，不写内联脚本 -->
  <script src="./pako.min.js"></script>
  <script src="./decoders.js"></script>
  <script src="./rules.js"></script>
  <script src="./panel.js"></script>
</body>
</html>
